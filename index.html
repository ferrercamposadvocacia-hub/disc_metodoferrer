<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método Ferrer | Identificação de Perfil Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F1E6;
    --cream-soft:#FBF8F2;
    --paper:#FFFFFF;
    --maroon:#4A1420;
    --maroon-deep:#33080F;
    --maroon-soft:#6C222E;
    --gold:#B8935A;
    --gold-bright:#C9A227;
    --gold-soft:#E4D2A6;
    --ink:#2B2117;
    --ink-soft:#7A6E60;
    --line:#E5DBC6;
    --d-color:#7A1F2B;
    --i-color:#C9A227;
    --s-color:#3F6659;
    --c-color:#33475B;
    --radius:16px;
    --font-display:'Playfair Display', serif;
    --font-body:'Inter', sans-serif;
    --shadow: 0 12px 32px -12px rgba(51,8,15,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit; cursor:pointer; border:none;}
  input{font-family:inherit;}
  a{color:inherit;}

  .container{max-width:1100px; margin:0 auto; padding:0 24px;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{width:40px; height:40px; border-radius:50%;}
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-text b{font-family:var(--font-display); font-size:16px; letter-spacing:.03em; color:var(--maroon-deep);}
  .brand-text span{font-size:10.5px; letter-spacing:.14em; color:var(--gold-bright); text-transform:uppercase; font-weight:600;}
  .nav-tabs{display:flex; gap:6px;}
  .nav-tab{
    padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:600;
    color:var(--ink-soft); background:transparent; transition:all .15s ease;
  }
  .nav-tab.active{background:var(--maroon-deep); color:#fff;}
  .nav-tab:not(.active):hover{background:var(--cream);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .user-chip{font-size:13px; color:var(--ink-soft); font-weight:500;}
  .user-chip b{color:var(--ink); font-weight:700;}
  .btn-logout{font-size:12.5px; font-weight:700; color:var(--maroon-soft); background:none; text-decoration:underline; text-underline-offset:3px;}
  @media (max-width:640px){.topbar{flex-wrap:wrap; gap:10px; padding:12px 16px;} .nav-tabs{order:3; width:100%; overflow-x:auto;} .nav-tab{padding:8px 12px; white-space:nowrap;} .user-chip{display:none;}}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 26px; border-radius:11px; font-weight:700; font-size:14.5px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--maroon-deep); color:#fff; box-shadow:0 8px 20px -8px rgba(51,8,15,.55);}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 26px -8px rgba(51,8,15,.6);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-gold{background:var(--gold-bright); color:#3A2C05;}
  .btn-gold:hover{transform:translateY(-1px);}
  .btn-outline{background:transparent; color:var(--maroon-deep); border:1.5px solid var(--maroon-deep);}
  .btn-outline:hover{background:var(--maroon-deep); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft); font-weight:600;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-block{width:100%;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr;
  }
  @media (max-width:860px){ .auth-wrap{grid-template-columns:1fr;} .auth-visual{min-height:260px;} }
  .auth-visual{
    background:
      radial-gradient(circle at 30% 20%, rgba(201,162,39,.18), transparent 45%),
      linear-gradient(160deg, var(--maroon-deep), var(--maroon) 55%, var(--maroon-soft));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:56px 40px; text-align:center; color:var(--cream-soft); position:relative; overflow:hidden;
  }
  .auth-visual::before{
    content:''; position:absolute; inset:0;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 70px, rgba(201,162,39,.05) 71px, transparent 72px);
    pointer-events:none;
  }
  .auth-visual img.emblem{width:150px; height:150px; border-radius:50%; box-shadow:0 20px 50px -14px rgba(0,0,0,.55); margin-bottom:26px; position:relative;}
  .auth-visual h1{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:.01em; margin-bottom:12px; position:relative;}
  .auth-visual p{font-size:14.5px; line-height:1.65; color:var(--gold-soft); max-width:340px; position:relative;}
  .auth-visual .tag{
    margin-top:28px; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold-bright); font-weight:700; position:relative;
  }
  .auth-form-side{display:flex; align-items:center; justify-content:center; padding:40px 24px; background:var(--cream-soft);}
  .auth-card{width:100%; max-width:380px;}
  .auth-card h2{font-family:var(--font-display); font-size:26px; color:var(--maroon-deep); margin-bottom:6px;}
  .auth-card .sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px; letter-spacing:.02em;}
  .field input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14.5px; background:#fff; transition:border-color .15s ease;
  }
  .field input:focus{outline:none; border-color:var(--gold-bright);}
  .field-hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
  .auth-switch{margin-top:22px; font-size:13.5px; text-align:center; color:var(--ink-soft);}
  .auth-switch button{background:none; color:var(--maroon-deep); font-weight:700; text-decoration:underline; text-underline-offset:3px;}
  .form-error{
    background:#FBE9E7; border:1px solid #E7B4AC; color:#8A2A1E; font-size:13px;
    padding:10px 13px; border-radius:9px; margin-bottom:16px; font-weight:600;
  }
  .form-note{
    margin-top:22px; font-size:11px; color:var(--ink-soft); background:var(--cream);
    padding:10px 12px; border-radius:9px; line-height:1.5; border:1px dashed var(--line);
  }

  /* ---------- Page shell ---------- */
  .page{padding-top:38px; padding-bottom:70px;}
  @media (max-width:640px){.container{padding:0 16px;} .page{padding-top:24px;}}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
  .page-head h1{font-family:var(--font-display); font-size:30px; color:var(--maroon-deep);}
  .page-head p{font-size:14px; color:var(--ink-soft); margin-top:4px;}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-bright); font-weight:700; margin-bottom:6px;}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}

  /* Dashboard hero */
  .hero-card{
    padding:34px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
    background:linear-gradient(120deg, var(--maroon-deep), var(--maroon-soft));
    color:#fff; border-radius:20px; margin-bottom:30px; position:relative; overflow:hidden;
  }
  .hero-card::after{
    content:''; position:absolute; right:-40px; top:-40px; width:220px; height:220px; border-radius:50%;
    border:1.5px solid rgba(201,162,39,.35);
  }
  .hero-card::before{
    content:''; position:absolute; right:10px; top:10px; width:160px; height:160px; border-radius:50%;
    border:1.5px solid rgba(201,162,39,.22);
  }
  .hero-text h2{font-family:var(--font-display); font-size:24px; margin-bottom:8px; position:relative;}
  .hero-text p{font-size:14px; color:var(--gold-soft); max-width:440px; line-height:1.6; position:relative;}

  .stats-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:30px;}
  @media (max-width:760px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:20px; border-radius:14px;}
  .stat-card .stat-num{font-family:var(--font-display); font-size:28px; color:var(--maroon-deep);}
  .stat-card .stat-label{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:4px;}
  .stat-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;}

  .section-title{font-family:var(--font-display); font-size:19px; color:var(--maroon-deep); margin-bottom:14px;}

  .results-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px;}
  .result-card{padding:20px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
  .result-card:hover{transform:translateY(-3px);}
  .result-card-top{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .result-name{font-weight:700; font-size:15px;}
  .result-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.03em;
    padding:4px 10px; border-radius:999px; color:#fff;
  }
  .mini-bars{display:flex; flex-direction:column; gap:6px;}
  .mini-bar-row{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-soft);}
  .mini-bar-row .lbl{width:14px; font-weight:800;}
  .mini-bar-track{flex:1; height:6px; background:var(--cream); border-radius:6px; overflow:hidden;}
  .mini-bar-fill{height:100%; border-radius:6px;}
  .mini-bar-pct{width:34px; text-align:right; font-weight:700;}

  .empty-state{
    text-align:center; padding:60px 30px; color:var(--ink-soft);
  }
  .empty-state h3{font-family:var(--font-display); color:var(--maroon-deep); font-size:19px; margin-bottom:8px;}
  .empty-state p{font-size:13.5px; max-width:380px; margin:0 auto 22px;}

  .search-bar{margin-bottom:20px;}
  .search-bar input{
    width:100%; max-width:340px; padding:11px 15px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; background:#fff;
  }
  .search-bar input:focus{outline:none; border-color:var(--gold-bright);}

  /* ---------- Quiz ---------- */
  .quiz-shell{max-width:760px; margin:0 auto;}
  .progress-wrap{margin-bottom:30px;}
  .progress-labels{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}
  .progress-track{height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold-bright), var(--maroon-deep)); border-radius:99px; transition:width .35s ease;}
  .quiz-card{padding:36px;}
  .quiz-instructions{font-size:13px; color:var(--ink-soft); margin-bottom:22px; line-height:1.6; background:var(--cream); padding:12px 15px; border-radius:10px;}
  .quiz-instructions b{color:var(--maroon-deep);}
  .quiz-group-label{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin:20px 0 10px; display:flex; align-items:center; gap:8px;}
  .quiz-group-label.most{color:var(--maroon-deep);}
  .quiz-group-label.least{color:var(--ink-soft);}
  .option-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:560px){.option-grid{grid-template-columns:1fr;}}
  .option-btn{
    text-align:left; padding:14px 16px; border-radius:11px; border:1.5px solid var(--line); background:#fff;
    font-size:14.5px; font-weight:600; color:var(--ink); transition:all .15s ease;
  }
  .option-btn:hover:not(:disabled){border-color:var(--gold-bright); background:var(--cream-soft);}
  .option-btn.selected-most{border-color:var(--maroon-deep); background:var(--maroon-deep); color:#fff;}
  .option-btn.selected-least{border-color:var(--ink-soft); background:var(--ink-soft); color:#fff;}
  .option-btn:disabled{opacity:.35; cursor:not-allowed;}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:28px;}

  /* ---------- Results ---------- */
  .results-shell{max-width:880px; margin:0 auto;}
  .results-top{display:grid; grid-template-columns:280px 1fr; gap:30px; margin-bottom:26px;}
  @media (max-width:760px){.results-top{grid-template-columns:1fr;}}
  .donut-card{padding:30px; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .donut-wrap{position:relative; width:200px; height:200px;}
  .donut-wrap .center-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .center-label .pct{font-family:var(--font-display); font-size:30px; color:var(--maroon-deep); font-weight:700;}
  .center-label .code{font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--ink-soft); margin-top:2px;}
  .legend{display:flex; flex-direction:column; gap:10px; margin-top:22px; width:100%;}
  .legend-row{display:flex; align-items:center; gap:10px; font-size:13px;}
  .legend-dot{width:11px; height:11px; border-radius:4px; flex-shrink:0;}
  .legend-name{flex:1; text-align:left; font-weight:600; color:var(--ink);}
  .legend-pct{font-weight:800; color:var(--maroon-deep);}

  .profile-panel{padding:30px;}
  .profile-panel .eyebrow{margin-bottom:4px;}
  .profile-panel h2{font-family:var(--font-display); font-size:25px; color:var(--maroon-deep); margin-bottom:12px;}
  .profile-panel p{font-size:14px; line-height:1.7; color:var(--ink); margin-bottom:14px;}
  .approach-box{
    background:var(--cream); border-left:4px solid var(--gold-bright); border-radius:10px;
    padding:16px 18px; font-size:13.5px; line-height:1.65; margin-top:6px;
  }
  .approach-box b{color:var(--maroon-deep); display:block; margin-bottom:6px; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;}
  .secondary-note{font-size:12.5px; color:var(--ink-soft); margin-top:16px; font-style:italic;}

  .full-breakdown{padding:26px 30px; margin-bottom:26px;}
  .breakdown-row{display:grid; grid-template-columns:130px 1fr 50px; align-items:center; gap:14px; margin-bottom:14px; font-size:13.5px;}
  .breakdown-row:last-child{margin-bottom:0;}
  .breakdown-label{font-weight:700;}
  .breakdown-track{height:10px; background:var(--cream); border-radius:99px; overflow:hidden;}
  .breakdown-fill{height:100%; border-radius:99px; transition:width .6s ease;}
  .breakdown-pct{text-align:right; font-weight:800; color:var(--ink);}

  .results-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px;}
  .email-note{
    max-width:520px; margin:16px auto 0; text-align:center; font-size:12px; color:var(--ink-soft); line-height:1.6;
  }

  .footer-note{text-align:center; padding:30px 20px 10px; font-size:11.5px; color:var(--ink-soft);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--maroon-deep); color:#fff; padding:13px 22px; border-radius:11px; font-size:13.5px; font-weight:600;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.4); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .loading-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--maroon-deep);
  }
  .loading-screen img{width:70px; height:70px; border-radius:50%; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.5; transform:scale(.97);} 50%{opacity:1; transform:scale(1);}}

  /* ---------- Report page ---------- */
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:14px;}
  .back-link:hover{color:var(--maroon-deep);}
  .type-badges{display:flex; gap:14px; margin-bottom:26px; flex-wrap:wrap;}
  .type-badge-card{display:flex; align-items:center; gap:13px; padding:13px 20px; border:1px solid var(--line); border-radius:14px; background:var(--paper); box-shadow:var(--shadow);}
  .type-badge-icon{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; flex-shrink:0;}
  .type-badge-label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-weight:700;}
  .type-badge-name{font-weight:800; font-size:14.5px; color:var(--ink);}
  .enhancing-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; color:var(--gold-bright);
    background:#FBF6E9; border:1px solid var(--gold-soft); padding:5px 12px; border-radius:999px; margin-bottom:18px;
  }
  .enhancing-dot{width:6px; height:6px; border-radius:50%; background:var(--gold-bright); animation:pulse 1s ease-in-out infinite;}

  .report-section{padding:26px 28px; margin-bottom:20px;}
  .report-section h3{font-family:var(--font-display); font-size:18px; color:var(--maroon-deep); margin-bottom:12px;}
  .report-section p{font-size:14px; line-height:1.75; color:var(--ink);}
  .report-section p + p{margin-top:10px;}
  .report-list{list-style:none; display:flex; flex-direction:column; gap:8px;}
  .report-list li{font-size:13.5px; line-height:1.55; padding-left:18px; position:relative; color:var(--ink);}
  .report-list li::before{content:'•'; position:absolute; left:0; color:var(--gold-bright); font-weight:800;}
  .two-col-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:760px){.two-col-grid{grid-template-columns:1fr;}}

  .radar-card{padding:30px; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .radar-legend{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; justify-content:center;}
  .radar-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .radar-legend-dot{width:9px; height:9px; border-radius:3px;}
  .report-hero{border-top:4px solid var(--maroon-deep);}
  .archetype-name{font-size:24px !important; margin-bottom:10px !important;}
  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:18px;}
  @media (max-width:760px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--cream); border-radius:12px; padding:12px 14px;}
  .kpi-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .kpi-val{font-size:14px; font-weight:800; color:var(--ink);}
  .kpi-tag{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .section-intro{font-size:12.5px !important; color:var(--ink-soft) !important; margin-bottom:14px;}
  .factor-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:760px){.factor-grid{grid-template-columns:1fr;}}
  .factor-item{border-left:4px solid; background:#FCFAF5; border-radius:10px; padding:14px 16px;}
  .factor-head{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
  .factor-item p{font-size:13px !important; line-height:1.6 !important;}
  .factor-gap{color:var(--ink-soft) !important; font-style:italic; margin-top:6px !important;}
  .factor-gap.muted{opacity:.8;}
  .lvl-pill{margin-left:auto; font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px;}
  .lvl-alto{background:#F3E1E3; color:#7A1F2B;} .lvl-moderado{background:#F3EEDF; color:#7A6420;} .lvl-baixo{background:#E6EDF2; color:#33475B;}
  .reco-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 24px;}
  @media (max-width:760px){.reco-grid{grid-template-columns:1fr;}}
  .reco p{font-size:13.5px !important;}
  .pdi-table-wrap{overflow-x:auto;}
  .pdi-table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
  .pdi-table th{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); text-align:left; padding:0 10px 10px; border-bottom:1px solid #E5DBC6;}
  .pdi-table td{padding:12px 10px; border-bottom:1px solid #F0E8D8; vertical-align:top; line-height:1.5;}
  .pdi-table .nowrap{white-space:nowrap; font-weight:700;}
  @media (max-width:640px){.pdi-table{min-width:0;} .pdi-table thead{display:none;} .pdi-table tr{display:grid; grid-template-columns:36px 1fr; gap:4px 10px; padding:12px 0; border-bottom:1px solid #F0E8D8;} .pdi-table td{padding:0; border:none;} .pdi-table td:first-child{grid-row:span 4;} .pdi-table td:nth-child(3)::before{content:'Ação: '; font-weight:700;} .pdi-table td:nth-child(4)::before{content:'Prazo: ';} .pdi-table td:nth-child(5)::before{content:'Como medir: '; font-weight:700;}}
  .method-note{background:#FCFAF5;}
  .method-note p{font-size:12.5px !important; color:var(--ink-soft) !important;}
  .radar-card-lg{align-items:stretch; text-align:left; margin-bottom:26px;}
  .radar-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;}
  .radar-layout{display:grid; grid-template-columns:1fr; gap:22px; align-items:center;}
  @media (max-width:900px){.radar-layout{grid-template-columns:1fr;}}
  .radar-chart-wrap{display:flex; flex-direction:column; align-items:center;}
  .radar-svg{width:100%; max-width:560px; height:auto; display:block; overflow:visible;}
  .radar-svg g{cursor:default;}
  .radar-legend-line{width:22px; height:0; border-top:3px solid; display:inline-block;}
  .radar-legend-line.dashed{border-top-style:dashed;}
  .radar-detail{width:100%; border-collapse:collapse; font-size:13px;}
  .radar-detail th{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); text-align:left; padding:0 8px 10px; border-bottom:1px solid #E5DBC6;}
  .radar-detail td{padding:12px 8px; border-bottom:1px solid #F0E8D8; vertical-align:middle;}
  .radar-detail .rd-num{font-weight:800; white-space:nowrap; text-align:right;}
  .radar-detail th:nth-child(n+3){text-align:right;}
  .rd-rank{font-weight:800; color:var(--ink-soft); font-size:12px;}
  .rd-badge{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; color:#fff; font-weight:900; font-size:12px; margin-right:8px; vertical-align:middle;}
  .rd-name{font-weight:800; vertical-align:middle;}
  .rd-level{font-size:11px; color:var(--ink-soft); margin:3px 0 0 32px;}
  .rd-mini{height:4px; background:var(--cream); border-radius:4px; margin-top:5px; overflow:hidden; min-width:56px;}
  .rd-mini span{display:block; height:100%; border-radius:4px;}
  .rd-note{font-size:11.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5;}
  @media (max-width:560px){.radar-detail{font-size:12px;} .radar-detail td,.radar-detail th{padding-left:3px; padding-right:3px;} .rd-level{display:none;} .rd-badge{margin-right:4px;} .radar-detail td:first-child,.radar-detail th:first-child{display:none;} .rd-mini{min-width:40px;}}

  .risk-pill{display:inline-flex; padding:5px 14px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.02em; margin-bottom:10px;}
  .risk-baixo{background:#E3F2E5; color:#2C6B34;}
  .risk-medio{background:#FDF0DC; color:#8A5A0E;}
  .risk-alto{background:#FBE6E3; color:#A32A1E;}

  .value-chip{display:inline-block; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; margin:4px 6px 0 0; border:1px solid;}
  .value-chip.predominante{background:var(--maroon-deep); color:#fff; border-color:var(--maroon-deep);}
  .value-chip.secundario{background:var(--cream); color:var(--maroon-deep); border-color:var(--line);}
  .chip-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin:14px 0 4px;}
  .chip-group-label:first-child{margin-top:0;}

  .cargo-row{display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .cargo-row:last-child{border-bottom:none;}
  .cargo-rank{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--ink-soft); width:20px; flex-shrink:0;}
  .cargo-info{flex:1; min-width:160px;}
  .cargo-name{font-weight:700; font-size:14px;}
  .cargo-desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .cargo-metric{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .cargo-track{width:110px; height:8px; background:var(--cream); border-radius:99px; overflow:hidden;}
  .cargo-fill{height:100%; border-radius:99px;}
  .cargo-pct{font-weight:800; font-size:13.5px; width:38px; text-align:right;}
  .qual-badge{font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap;}
  .qual-excelente{background:#E3F2E5; color:#2C6B34;}
  .qual-muitobom{background:#E7EFFC; color:#2C4F8A;}
  .qual-bom{background:#FDF0DC; color:#8A5A0E;}
  .qual-regular{background:#F3F0EA; color:#7A6E60;}

  .pdi-list{display:flex; flex-direction:column; gap:14px;}
  .pdi-item{display:flex; gap:14px; align-items:flex-start;}
  .pdi-num{width:26px; height:26px; border-radius:50%; background:var(--maroon-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
  .pdi-text{font-size:13.5px; line-height:1.6; padding-top:3px; color:var(--ink);}

  /* ---------- Plans / SaaS ---------- */
  .plan-usage-pill{
    display:inline-flex; align-items:center; margin-top:14px; font-size:12px; font-weight:700; color:var(--gold-soft);
    background:rgba(255,255,255,.08); border:1px solid rgba(228,210,166,.35); padding:7px 14px; border-radius:999px;
  }
  .plans-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  @media (max-width:960px){.plans-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.plans-grid{grid-template-columns:1fr;}}
  .plan-card{padding:26px 22px; position:relative; display:flex; flex-direction:column; gap:6px;}
  .plan-highlight{border-color:var(--gold-bright); box-shadow:0 14px 34px -14px rgba(201,162,39,.4);}
  .plan-badge{
    position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--gold-bright); color:#3A2C05;
    font-size:10.5px; font-weight:800; padding:4px 12px; border-radius:999px; letter-spacing:.03em;
  }
  .plan-name{font-family:var(--font-display); font-size:19px; color:var(--maroon-deep);}
  .plan-tagline{font-size:12px; color:var(--ink-soft); min-height:32px;}
  .plan-price{display:flex; align-items:baseline; gap:6px; margin:8px 0 2px; flex-wrap:wrap;}
  .plan-price-old{font-size:13px; color:var(--ink-soft); text-decoration:line-through;}
  .plan-price-num{font-family:var(--font-display); font-size:26px; color:var(--ink); font-weight:700;}
  .plan-price-suffix{font-size:12px; color:var(--ink-soft);}
  .plan-limit{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:14px;}
  .coupon-feedback{font-size:12.5px; font-weight:600; margin-top:8px; padding:8px 12px; border-radius:8px;}
  .coupon-good{background:#E3F2E5; color:#2C6B34;}
  .coupon-bad{background:#FBE6E3; color:#A32A1E;}

  /* ---------- Admin ---------- */
  .coupon-form{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px;}
  @media (max-width:600px){.coupon-form{grid-template-columns:1fr;}}
  .coupon-list{display:flex; flex-direction:column; gap:10px;}
  .coupon-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:14px 16px; border:1px solid var(--line); border-radius:12px;
  }
  .coupon-row-main{flex:1; min-width:200px;}
  .coupon-code{font-weight:800; font-size:14px; letter-spacing:.02em; color:var(--maroon-deep);}
  .coupon-details{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
  .coupon-row-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}

  .standalone-banner{
    background:#FDF0DC; border:1px solid #E9C98A; color:#8A5A0E; font-size:12.5px; font-weight:600;
    padding:12px 16px; border-radius:10px; margin-bottom:20px; line-height:1.5;
  }
</style>
</head>

/* ============ Modo standalone (fora do Claude.ai) ============ */
// Se window.storage não existir (ex.: hospedado no GitHub Pages), criamos um
// substituto baseado em localStorage com a mesma interface. Isso faz login,
// avaliações, planos e cupons funcionarem, mas os dados ficam salvos apenas
// neste navegador/dispositivo — não são compartilhados entre pessoas diferentes.
const IS_STANDALONE_MODE = (typeof window.storage === 'undefined');
if(IS_STANDALONE_MODE){
  window.storage = {
    async get(key){
      const raw = localStorage.getItem('mf_'+key);
      if(raw===null) return null;
      return { key, value: raw, shared:false };
    },
    async set(key, value){
      localStorage.setItem('mf_'+key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      const existed = localStorage.getItem('mf_'+key) !== null;
      localStorage.removeItem('mf_'+key);
      return { key, deleted:existed, shared:false };
    },
    async list(prefix){
      const p = 'mf_'+(prefix||'');
      const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(3));
      return { keys, prefix, shared:false };
    }
  };
}

  ROLE_ORDER.forEach(role=>{
    const w = ROLE_WEIGHTS[role];
    fit[role] = Math.round((w.D*scores.D + w.I*scores.I + w.S*scores.S + w.C*scores.C)*10)/10;
  });
  return Object.entries(fit).sort((a,b)=>b[1]-a[1]);
}

function roleLabel(pct){
  // Como os fatores DISC somam 100%, a aderência ponderada fica tipicamente entre 15% e 45%
  if(pct>=35) return {text:'Excelente', cls:'qual-excelente'};
  if(pct>=30) return {text:'Muito bom', cls:'qual-muitobom'};
  if(pct>=25) return {text:'Bom', cls:'qual-bom'};
  return {text:'Regular', cls:'qual-regular'};
}

/* ============ Relatório: motor de texto (fallback determinístico, contextualizado) ============ */
function computeAdaptation(natural, adaptado){
  const diffs = ['D','I','S','C'].map(k=>({k, n:natural[k], a:adaptado[k], diff: Math.round((adaptado[k]-natural[k])*10)/10}));
  const indice = Math.round(diffs.reduce((s,d)=>s+Math.abs(d.diff),0)/2*10)/10;
  const nivel = indice<10 ? 'Baixa' : (indice<20 ? 'Moderada' : 'Alta');
  return {diffs, indice, nivel};
}
function buildGapAnalysis(natural, adaptado, name){
  const first = firstName(name);
  const {diffs, indice, nivel} = computeAdaptation(natural, adaptado);
  const sig = diffs.filter(d=>Math.abs(d.diff)>=5).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  let txt = `O índice de adaptação de ${first} é de ${indice} p.p. (adaptação ${nivel.toLowerCase()}). `;
  if(nivel==='Baixa') txt += 'Seu comportamento no trabalho é muito próximo do jeito natural, o que indica baixo gasto de energia adaptativa e boa sintonia com o ambiente atual.';
  else if(nivel==='Moderada') txt += 'Há ajustes relevantes entre o jeito natural e o comportamento no trabalho — esforço sustentável, mas que merece atenção em períodos de maior pressão.';
  else txt += 'O comportamento no trabalho se distancia bastante do natural, o que exige esforço adaptativo significativo e pode gerar desgaste a médio prazo se não houver alinhamento de função e ambiente.';
  if(sig.length){
    txt += ' Principais ajustes: ' + sig.map(d=>`${PROFILE_INFO[d.k].name} ${d.diff>0?'sobe':'cai'} de ${d.n}% para ${d.a}%, sinalizando que ${GAP_MEANING[d.k][d.diff>0?'up':'down']}`).join('; ') + '.';
  }
  return txt;
}
function roleReading(scores, roleKey, name){
  const w = ROLE_WEIGHTS[roleKey], info = ROLE_INFO[roleKey];
  const demand = Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k);
  const parts = demand.map(k=>`${PROFILE_INFO[k].name} (${LEVEL_LABEL[factorLevel(scores[k])].toLowerCase()} no perfil, ${scores[k]}%)`);
  const gaps = demand.filter(k=>factorLevel(scores[k])==='baixo');
  let t = `A função de ${info.name} (${info.full}) exige principalmente ${parts.join(' e ')}. ${info.why}`;
  if(gaps.length) t += ` Ponto de atenção: ${gaps.map(k=>PROFILE_INFO[k].name).join(' e ')} aparece em nível baixo, o que pede apoio de processo ou desenvolvimento específico para sustentar o desempenho.`;
  return t;
}
function buildFallbackReport(result){
  const scores = result.scores;
  const adaptado = result.scoresAdaptado || result.scores;
  const ranked = dominantProfile(scores);
  const [t1,v1] = ranked[0], [t2,v2] = ranked[1], [t4,v4] = ranked[3];
  const roleRanked = computeRoleFit(scores);
  const topKey = roleRanked[0][0], topRole = ROLE_INFO[topKey];
  const secRole = ROLE_INFO[roleRanked[1][0]];
  const p1 = PROFILE_INFO[t1], p2 = PROFILE_INFO[t2];
  const first = firstName(result.name);
  const combo = COMBOS[t1+t2];
  const adapt = computeAdaptation(scores, adaptado);
  const intensidade = v1>=45 ? ', em intensidade bastante acentuada' : (v1-v2<4 ? ', em nível muito próximo ao do segundo fator' : '');

  // Risco de desengajamento: combina esforço adaptativo e aderência à função
  let riscoPts = 0; const motivosRisco = [];
  if(adapt.nivel==='Alta'){ riscoPts+=2; motivosRisco.push('alto esforço de adaptação entre o natural e o trabalho'); }
  else if(adapt.nivel==='Moderada'){ riscoPts+=1; motivosRisco.push('ajustes moderados de comportamento no trabalho'); }
  if(roleRanked[0][1]<30){ riscoPts+=1; motivosRisco.push('aderência apenas moderada à função sugerida'); }
  const nivelRisco = riscoPts>=2 ? 'Alto' : (riscoPts===1 ? 'Médio' : 'Baixo');

  const pdiPlano = [
    Object.assign({prazo:'30 dias'}, PDI_ALTO[t1]),
    Object.assign({prazo:'60 dias'}, factorLevel(v4)==='baixo' ? PDI_BAIXO[t4] : PDI_ALTO[t2]),
  ];
  const roleDemand = Object.entries(ROLE_WEIGHTS[topKey]).sort((a,b)=>b[1]-a[1]).map(([k])=>k).find(k=>factorLevel(scores[k])!=='alto' && k!==t4);
  if(roleDemand) pdiPlano.push(Object.assign({prazo:'90 dias'}, PDI_BAIXO[roleDemand], {foco: PDI_BAIXO[roleDemand].foco+' (exigência da função)'}));
  pdiPlano.push({prazo:'Contínuo', foco:'Feedback e acompanhamento', acao:'Reunião mensal de 30 minutos com o gestor para revisar o PDI e ajustar metas comportamentais.', indicador:'Evolução percebida pelo gestor e nova avaliação DISC em 6 meses.'});

  return {
    arquetipo: combo.nome,
    resumoExecutivo: `${result.name} tem como fator predominante a ${p1.name} (${t1} · ${v1}%)${intensidade}, com ${p2.name} (${t2} · ${v2}%) como segundo traço — combinação que caracteriza o arquétipo "${combo.nome}". ${combo.texto} No ambiente de trabalho, a adaptação é ${adapt.nivel.toLowerCase()} (${adapt.indice} p.p.). A maior aderência comercial é para ${topRole.name} (${topRole.full}, ${roleRanked[0][1]}%), seguida de ${secRole.name} (${roleRanked[1][1]}%).`,
    descricaoPerfil: `${p1.desc} ${FACTOR_READ[t1][factorLevel(v1)]} O traço de ${p2.name.toLowerCase()} acrescenta: ${p2.desc.charAt(0).toLowerCase()+p2.desc.slice(1)} ${combo.comercial}`,
    comunicacao: `Comunicação ${TXT.comunicacao[t1]} e, em segundo plano, ${TXT.comunicacao[t2]}. ${factorLevel(scores.I)==='baixo' ? 'Tende a ser mais econômica nas palavras e pode precisar investir conscientemente em proximidade.' : (factorLevel(scores.I)==='alto' ? 'Tem facilidade natural para engajar, e o desafio é manter objetividade e registro do que foi combinado.' : 'Equilibra bem conteúdo e relacionamento, ajustando o tom ao interlocutor.')}`,
    lideranca: `Sua liderança tende a ser ${TXT.lideranca[t1]} e, em segundo plano, ${TXT.lideranca[t2]}. ${t1==='D'||t1==='C' ? 'Precisa cuidar do lado humano da gestão — reconhecimento e escuta — para não ser percebido(a) apenas como cobrador(a).' : 'Precisa cuidar da firmeza na cobrança e da clareza de metas para não ser percebido(a) como permissivo(a).'}`,
    tomadaDecisao: `Toma decisões de forma ${TXT.decisao[t1]}; o traço de ${p2.name.toLowerCase()} faz com que também considere ${t2==='D'?'a velocidade e o impacto no resultado':t2==='I'?'o efeito sobre as pessoas envolvidas':t2==='S'?'a segurança e a opinião do grupo':'os dados e os riscos envolvidos'}. ${factorLevel(scores.C)==='baixo' ? 'Atenção a decisões tomadas sem checagem suficiente de detalhes.' : (factorLevel(scores.C)==='alto' ? 'Atenção ao risco de adiar decisões simples por excesso de análise.' : '')}`,
    motivadores: uniq([...TXT.motivadores[t1], ...TXT.motivadores[t2]]).slice(0,5),
    desmotivadores: uniq([...TXT.desmotivadores[t1], ...TXT.desmotivadores[t2]]).slice(0,4),
    pontosFortes: uniq([...TXT.forcas[t1], ...TXT.forcas[t2]]).slice(0,5),
    pontosDesenvolvimento: uniq([...TXT.desenvolvimento[t1], ...TXT.desenvolvimento[t2], ...(factorLevel(v4)==='baixo'?[PDI_BAIXO[t4].foco+': '+PDI_BAIXO[t4].acao.charAt(0).toLowerCase()+PDI_BAIXO[t4].acao.slice(1)]:[])]).slice(0,4),
    comportamentoPressao: `Sob pressão, ${first} ${TXT.pressao[t1]}. Como segundo movimento, ${TXT.pressao[t2]}. ${REEQUILIBRIO[t1]}`,
    potencialCrescimento: `Tem potencial para crescer em funções que valorizem ${p1.name.toLowerCase()} e ${p2.name.toLowerCase()}, como ${topRole.name} e ${secRole.name}. ${roleRanked.find(([k])=>k==='GESTAO')[1]>=30 ? 'O perfil também mostra base para assumir responsabilidades de gestão no médio prazo, com desenvolvimento em liderança de pessoas.' : 'Para funções de gestão, precisará desenvolver mais firmeza decisória e leitura de indicadores.'}`,
    riscoDesengajamento: { nivel:nivelRisco, texto: `${motivosRisco.length ? 'Fatores de atenção: '+motivosRisco.join('; ')+'. ' : 'Não há sinais relevantes de desgaste adaptativo no momento. '}O engajamento tende a cair quando faltam motivadores como "${TXT.motivadores[t1][0].replace(/\.$/,'')}", ou quando o ambiente reúne desmotivadores como "${TXT.desmotivadores[t1][0].replace(/\.$/,'')}".` },
    compatibilidadeEquipes: EQUIPE[t1],
    compatibilidadeGestao: `Responde melhor a uma liderança que ofereça ${GESTOR[t1].reconhecimento.charAt(0).toLowerCase()+GESTOR[t1].reconhecimento.slice(1).replace(/\.$/,'')}. Tende a ter mais atrito com ${ATRITO_GESTAO[t1]}.`,
    vantagensDesvantagens: {
      vantagens: uniq([...VANTAGENS[t1], ...VANTAGENS[t2].slice(0,1)]).slice(0,4),
      desvantagens: uniq([...DESVANTAGENS[t1], ...DESVANTAGENS[t2].slice(0,1)]).slice(0,4)
    },
    valoresPessoais: {
      texto: `Seus valores centrais giram em torno de ${TXT.valores[t1].join(' e ')}, reforçados por ${TXT.valores[t2].join(' e ').toLowerCase()}. Ambientes que honram esses valores tendem a gerar mais comprometimento e permanência.`,
      predominantes: uniq([...TXT.valores[t1], ...TXT.valores[t2]]).slice(0,4),
      secundarios: uniq([...TXT.valores[ranked[2][0]], ...TXT.valores[t4]]).slice(0,3)
    },
    ancorasCarreira: uniq([TXT.ancoras[t1], TXT.ancoras[t2]]),
    conflitosValores: `Pode haver desconforto em ambientes que contrariem sua necessidade de ${TXT.valores[t1][0].toLowerCase()} — por exemplo, ${TXT.desmotivadores[t1][0].charAt(0).toLowerCase()+TXT.desmotivadores[t1][0].slice(1).replace(/\.$/,'')}. Também pode haver atrito com colegas de perfil ${PROFILE_INFO[OPPOSITE[t1]].name.toLowerCase()} acentuado, se as diferenças de ritmo não forem conversadas.`,
    pdi: pdiPlano.map(p=>`${p.foco}: ${p.acao}`),
    pdiPlano,
    conclusaoExecutiva: `${result.name} reúne características do arquétipo "${combo.nome}" e tem maior potencial de contribuição como ${topRole.name}, com ${secRole.name} como alternativa. Para potencializar o resultado, recomenda-se: alocar em ambiente com ${AMBIENTE[t1].slice(0,2).join(' e ').toLowerCase()}; acompanhar de perto o PDI nos próximos 90 dias; e ${adapt.nivel==='Alta' ? 'revisar o alinhamento entre função e perfil natural, dado o alto esforço adaptativo' : 'manter a avaliação periódica para monitorar a evolução do perfil'}.`,
    analiseGap: buildGapAnalysis(scores, adaptado, result.name)
  };
}
// Mantém textos da IA quando existirem; o restante vem sempre do motor atual (mais completo)
function getReport(r){
  const base = buildFallbackReport(r);
  if(r.reportEnhanced && r.report){
    const ai = Object.assign({}, r.report);
    delete ai.pdi; delete ai.pdiPlano; delete ai.arquetipo;
    return Object.assign(base, ai);
  }
  return base;
}

function sanitizeAIReport(p){
  if(!p || typeof p!=='object') return {};
  const out = {};
  const strFields=['resumoExecutivo','descricaoPerfil','comunicacao','lideranca','tomadaDecisao','comportamentoPressao','potencialCrescimento','compatibilidadeEquipes','compatibilidadeGestao','conflitosValores','conclusaoExecutiva','analiseGap'];
  const arrFields=['motivadores','desmotivadores','pontosFortes','pontosDesenvolvimento','ancorasCarreira','pdi'];
  strFields.forEach(f=>{ if(typeof p[f]==='string' && p[f].trim()) out[f]=p[f].trim(); });
  arrFields.forEach(f=>{ if(Array.isArray(p[f]) && p[f].length) out[f]=p[f].filter(x=>typeof x==='string' && x.trim()).slice(0,6); });
  if(p.riscoDesengajamento && typeof p.riscoDesengajamento==='object' && ['Baixo','Médio','Alto'].includes(p.riscoDesengajamento.nivel)){
    out.riscoDesengajamento = { nivel:p.riscoDesengajamento.nivel, texto: typeof p.riscoDesengajamento.texto==='string'? p.riscoDesengajamento.texto.trim(): '' };
  }
  if(p.valoresPessoais && typeof p.valoresPessoais==='object'){
    out.valoresPessoais = {
      texto: typeof p.valoresPessoais.texto==='string'? p.valoresPessoais.texto.trim(): '',
      predominantes: Array.isArray(p.valoresPessoais.predominantes)? p.valoresPessoais.predominantes.filter(x=>typeof x==='string').slice(0,5): [],
      secundarios: Array.isArray(p.valoresPessoais.secundarios)? p.valoresPessoais.secundarios.filter(x=>typeof x==='string').slice(0,5): []
    };
  }
  if(p.vantagensDesvantagens && typeof p.vantagensDesvantagens==='object'){
    const vantagens = Array.isArray(p.vantagensDesvantagens.vantagens)? p.vantagensDesvantagens.vantagens.filter(x=>typeof x==='string' && x.trim()).slice(0,5): [];
    const desvantagens = Array.isArray(p.vantagensDesvantagens.desvantagens)? p.vantagensDesvantagens.desvantagens.filter(x=>typeof x==='string' && x.trim()).slice(0,5): [];
    if(vantagens.length || desvantagens.length) out.vantagensDesvantagens = { vantagens, desvantagens };
  }
  return out;
}

function buildReportPrompt(result, roleRanked, discRanked){
  const discText = discRanked.map(([k,v])=>`${PROFILE_INFO[k].name} (${k}): ${v}%`).join(', ');
  const adaptado = result.scoresAdaptado || result.scores;
  const adaptadoText = ['D','I','S','C'].map(k=>`${PROFILE_INFO[k].name} (${k}): ${adaptado[k]}%`).join(', ');
  const roleText = roleRanked.slice(0,3).map(([k,v])=>`${ROLE_INFO[k].name} (${ROLE_INFO[k].full}): ${v}%`).join(', ');
  const topRoleFull = ROLE_INFO[roleRanked[0][0]].full;
  return `Você é um analista de perfil comportamental sênior. Gere um relatório executivo em português do Brasil, tom profissional e caloroso, para ${result.name}, com base no perfil DISC abaixo. Responda APENAS com um objeto JSON válido, sem markdown, sem crases, sem texto antes ou depois.

Seja contextualizado, não genérico: cada campo de texto deve ter de 3 a 4 frases, citando os percentuais e a interação entre os fatores (predominante, secundário e o menos expressivo); cada item de lista deve ser uma frase específica (até 22 palavras) que explique o porquê prático daquele ponto, não apenas um rótulo solto. Em "vantagensDesvantagens", explique especificamente como o perfil ajuda (vantagem) ou pode atrapalhar (desvantagem) no dia a dia da função de ${topRoleFull}.

Perfil DISC Natural (percentuais): ${discText}
Perfil DISC Adaptado, no ambiente de trabalho (percentuais): ${adaptadoText}
Arquétipo comportamental identificado: ${COMBOS[discRanked[0][0]+discRanked[1][0]].nome}
Índice de adaptação (soma das diferenças Natural x Adaptado / 2): ${computeAdaptation(result.scores, adaptado).indice} p.p.
Funções comerciais mais aderentes ao perfil: ${roleText}

Retorne exatamente este formato JSON (preencha todos os campos, "analiseGap" deve comparar o perfil Natural e o Adaptado):
{"resumoExecutivo":"","descricaoPerfil":"","comunicacao":"","lideranca":"","tomadaDecisao":"","motivadores":["","",""],"desmotivadores":["","",""],"pontosFortes":["","",""],"pontosDesenvolvimento":["","",""],"comportamentoPressao":"","potencialCrescimento":"","riscoDesengajamento":{"nivel":"Baixo|Médio|Alto","texto":""},"compatibilidadeEquipes":"","compatibilidadeGestao":"","vantagensDesvantagens":{"vantagens":["","",""],"desvantagens":["","",""]},"valoresPessoais":{"texto":"","predominantes":["","",""],"secundarios":["",""]},"ancorasCarreira":["","",""],"conflitosValores":"","pdi":["","","",""],"conclusaoExecutiva":"","analiseGap":""}`;
}

async function enhanceReportWithAI(result){
  state.enhancingId = result.id;
  if(state.view==='results') render();
  try{
    const roleRanked = computeRoleFit(result.scores);
    const discRanked = dominantProfile(result.scores);
    const prompt = buildReportPrompt(result, roleRanked, discRanked);
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:4000, messages:[{role:"user", content:prompt}] })
    });
    if(!resp.ok) throw new Error('Falha na requisição: '+resp.status);
    const data = await resp.json();
    const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    const sanitized = sanitizeAIReport(parsed);
    if(Object.keys(sanitized).length){
      result.report = Object.assign({}, result.report, sanitized);
      result.reportEnhanced = true;
    }
  }catch(err){
    console.error('Não foi possível aprimorar o relatório com IA, mantendo versão padrão:', err);
  }finally{
    if(state.enhancingId===result.id) state.enhancingId=null;
    saveResults().catch(e=>console.error('Erro ao salvar relatório:', e));
    const current = state.results.find(x=>x.id===state.lastResultId);
    if(state.view==='results' && current && current.id===result.id) render();
  }
}

async function handleRegister(e){
  e.preventDefault();
  const f = e.target;
  const name=f.name.value.trim(), email=f.email.value.trim().toLowerCase(),
        company=f.company.value.trim(), pass=f.password.value;
  if(!name||!email||!pass){ state.authError='Preencha nome, e-mail e senha.'; render(); return; }
  if(pass.length<4){ state.authError='A senha deve ter ao menos 4 caracteres.'; render(); return; }
  if(state.users[email]){ state.authError='Já existe um cadastro com este e-mail.'; render(); return; }
  const isFirstUser = Object.keys(state.users).length === 0;
  const grantsAdmin = isFirstUser || ADMIN_EMAILS.includes(email);
  state.users[email] = { name, email, company, password: btoa(unescape(encodeURIComponent(pass))), createdAt: Date.now(), plan:'free', planUpdatedAt: Date.now(), isAdmin: grantsAdmin };
  state.currentUser = state.users[email];
  state.view='dashboard'; state.authError='';
  render();
  showToast(grantsAdmin ? `Cadastro realizado! Sua conta é administradora.` : ('Cadastro realizado com sucesso, ' + name.split(' ')[0] + '!'));
  try{
    await saveUsers();
  }catch(err){
    console.error('Erro ao salvar cadastro:', err);
    showToast('Você está logado(a), mas houve um problema ao salvar seu cadastro. Evite fechar o app agora.');
  }
}
async function handleLogin(e){
  e.preventDefault();
  const f=e.target;
  const email=f.email.value.trim().toLowerCase(), pass=f.password.value;
  const u = state.users[email];
  if(!u || u.password !== btoa(unescape(encodeURIComponent(pass)))){
    state.authError='E-mail ou senha inválidos.'; render(); return;
  }
  if(!u.plan) u.plan = 'free';
  if(typeof u.isAdmin !== 'boolean') u.isAdmin = false;
  if(ADMIN_EMAILS.includes(u.email) && !u.isAdmin){ u.isAdmin = true; saveUsers().catch(err=>console.error(err)); }
  state.currentUser = u; state.view='dashboard'; state.authError='';
  render();
  showToast('Bem-vindo(a) de volta, ' + u.name.split(' ')[0] + '!');
}

/* ============ Quiz ============ */
function shuffled(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function monthlyUsedCount(email){
  const now = new Date();
  return state.results.filter(r=>{
    if(r.email!==email) return false;
    const d = new Date(r.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
}
function assessmentQuota(){
  const plan = userPlan(state.currentUser);
  const used = monthlyUsedCount(state.currentUser.email);
  return { plan, used, limit: plan.limit, allowed: used < plan.limit };
}

    naturalMost:Array(20).fill(null),
    naturalLeast:Array(20).fill(null),
    adaptadoMost:Array(20).fill(null),
    adaptadoLeast:Array(20).fill(null)
  };
  state.view='quiz';
  render();
}
function quizMostArr(){ return state.quiz.phase==='natural' ? state.quiz.naturalMost : state.quiz.adaptadoMost; }
function quizLeastArr(){ return state.quiz.phase==='natural' ? state.quiz.naturalLeast : state.quiz.adaptadoLeast; }
function quizOrder(){ return state.quiz.phase==='natural' ? state.quiz.orderNatural[state.quiz.index] : state.quiz.orderAdaptado[state.quiz.index]; }
function pickMost(cat){
  const q=state.quiz, most=quizMostArr(), least=quizLeastArr();
  most[q.index] = cat;
  if(least[q.index] === cat) least[q.index] = null;
  render();
}
function pickLeast(cat){
  const q=state.quiz, most=quizMostArr(), least=quizLeastArr();
  if(most[q.index] === cat) return;
  least[q.index] = cat;
  render();
}
function quizBack(){
  if(state.quiz.index>0){ state.quiz.index--; render(); }
}
function continueToAdaptado(){
  state.quiz.phase='adaptado';
  state.quiz.index=0;
  render();
}
async function quizNext(){
  const q=state.quiz, most=quizMostArr(), least=quizLeastArr();
  if(most[q.index]===null || least[q.index]===null) return;
  if(q.index < 19){ q.index++; render(); return; }
  if(q.phase==='natural'){ q.phase='transition'; render(); return; }
  await finishQuiz();
}
function scoreFromPicks(mostArr, leastArr){
  const mostCounts={D:0,I:0,S:0,C:0}; mostArr.forEach(c=>mostCounts[c]++);
  const leastCounts={D:0,I:0,S:0,C:0}; leastArr.forEach(c=>leastCounts[c]++);
  const pct={}; Object.keys(mostCounts).forEach(k=> pct[k] = Math.round((mostCounts[k]/20)*1000)/10);
  return { pct, mostCounts, leastCounts };
}
async function finishQuiz(){
  const q = state.quiz;
  const natural = scoreFromPicks(q.naturalMost, q.naturalLeast);
  const adaptado = scoreFromPicks(q.adaptadoMost, q.adaptadoLeast);
  const result = {
    id: 'r_'+Date.now(),
    email: state.currentUser.email,
    name: state.currentUser.name,
    company: state.currentUser.company||'',
    date: Date.now(),
    scores: natural.pct,
    mostCounts: natural.mostCounts,
    leastCounts: natural.leastCounts,
    scoresAdaptado: adaptado.pct,
    mostCountsAdaptado: adaptado.mostCounts,
    leastCountsAdaptado: adaptado.leastCounts
  };
  // Gera o relatório completo imediatamente (motor local) — nunca fica travado esperando rede.
  result.report = buildFallbackReport(result);
  result.reportEnhanced = false;
  state.results.push(result);
  state.lastResultId = result.id;
  state.quiz = null;
  state.view = 'results';
  render();
  // Salva em segundo plano; se falhar, avisa mas não bloqueia a navegação.
  try{
    await saveResults();
  }catch(err){
    console.error('Erro ao salvar resultado:', err);
    showToast('Resultado calculado, mas houve um problema ao salvar. Tente novamente mais tarde.');
  }
  // Tenta aprimorar o texto do relatório com IA, sem bloquear a navegação.
  // Fora do Claude.ai essa chamada nunca teria sucesso, então nem tentamos.
  if(!IS_STANDALONE_MODE){
    enhanceReportWithAI(result);
  }
}

function dominantProfile(scores){

}
function myResults(){

function fmtDate(ts){
  return new Date(ts).toLocaleDateString('pt-BR', {day:'2-digit',month:'short',year:'numeric'});
}
function donutSVG(scores, size=200){
  const order=['D','I','S','C'];
  const r=80, c=2*Math.PI*r, cx=size/2, cy=size/2;
  let offset=0;
  const circles = order.map(k=>{
    const val=scores[k]/100;
    const len = val*c;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PROFILE_INFO[k].hex}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}
function radarSVG(scores, scoresAdaptado, size=520){
  const R=size*0.33, cx=size/2, cy=size/2;
  const keys=['D','I','S','C'];
  // escala dinâmica: como os 4 fatores somam 100%, usar 0–100% deixaria o gráfico pequeno demais
  const allVals = keys.map(k=>scores[k]).concat(scoresAdaptado? keys.map(k=>scoresAdaptado[k]) : []);
  const MAX = Math.min(100, Math.max(40, Math.ceil((Math.max(...allVals)+5)/10)*10));
  const sc = v => R*v/MAX;
  const angles = {D:-90, I:0, S:90, C:180};
  const F='font-family="Inter, sans-serif"';
  function pt(angleDeg, r){
    const rad = angleDeg*Math.PI/180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  const step = MAX<=60 ? 5 : 10;
  const levels=[]; for(let v=step; v<=MAX; v+=step) levels.push(v);
  const gridPolys = levels.map(lv=>{
    const r = sc(lv);
    const pts = keys.map(k=>pt(angles[k], r).join(',')).join(' ');
    const major = lv%(step*2)===0 || lv===MAX;
    return `<polygon points="${pts}" fill="${lv===MAX?'rgba(229,219,198,0.18)':'none'}" stroke="#E5DBC6" stroke-width="${major?1.2:0.6}" ${major?'':'stroke-dasharray="2 3"'}/>`;
  }).join('');
  const levelLabels = levels.filter(lv=>lv%(step*2)===0 || lv===MAX).map(lv=>{
    const [x,y]=pt(-45, sc(lv)/Math.SQRT2*1.0);
    return `<text x="${x+4}" y="${y-4}" font-size="10.5" font-weight="600" fill="#9A8C74" ${F}>${lv}%</text>`;
  }).join('');
  const axisLines = keys.map(k=>{
    const [x,y]=pt(angles[k], R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D9CCB0" stroke-width="1.2"/>`;
  }).join('');
  function polygonFor(o){ return keys.map(k=> pt(angles[k], sc(o[k])).join(',')).join(' '); }
  const naturalPolygon = `<polygon points="${polygonFor(scores)}" fill="rgba(74,20,32,0.18)" stroke="#4A1420" stroke-width="3" stroke-linejoin="round"/>`;
  let adaptadoPolygon = '', adaptadoDots = '';
  // deslocamento dos rótulos de valor para não sobrepor (perpendicular ao eixo)
  const off = {D:[1,0], I:[0,1], S:[1,0], C:[0,1]};
  if(scoresAdaptado){
    adaptadoPolygon = `<polygon points="${polygonFor(scoresAdaptado)}" fill="rgba(43,123,214,0.12)" stroke="${ADAPT_COLOR}" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>`;
    adaptadoDots = keys.map(k=>{
      const [x,y]=pt(angles[k], sc(scoresAdaptado[k]));
      const [ox,oy]=off[k];
      return `<g><title>${PROFILE_INFO[k].name} · Adaptado: ${scoresAdaptado[k]}%</title>
        <circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="${ADAPT_COLOR}" stroke-width="3"/></g>`;
    }).join('');
  }
  const dots = keys.map(k=>{
    const [x,y]=pt(angles[k], sc(scores[k]));
    const [ox,oy]=off[k];
    return `<g><title>${PROFILE_INFO[k].name} · Natural: ${scores[k]}%</title>
      <circle cx="${x}" cy="${y}" r="7" fill="${PROFILE_INFO[k].hex}" stroke="#fff" stroke-width="2.5"/></g>`;
  }).join('');
  const labels = keys.map(k=>{
    const [x,y]=pt(angles[k], R+40);
    const anchor = k==='I'?'start':(k==='C'?'end':'middle');
    const lx = k==='I'? x-26 : (k==='C'? x+26 : x);
    const ad = scoresAdaptado ? ` · A ${scoresAdaptado[k]}%` : '';
    return `<text x="${lx}" y="${y-8}" text-anchor="${anchor}" dominant-baseline="middle" font-size="20" font-weight="900" fill="${PROFILE_INFO[k].hex}" ${F}>${k} <tspan font-size="14" font-weight="700">${PROFILE_INFO[k].name}</tspan></text>
      <text x="${lx}" y="${y+12}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12" font-weight="600" fill="#7A6E5A" ${F}>N ${scores[k]}%${ad}</text>`;
  }).join('');
  return `<svg class="radar-svg" viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Radar DISC: perfil natural e adaptado">${gridPolys}${axisLines}${levelLabels}${adaptadoPolygon}${naturalPolygon}${adaptadoDots}${dots}${labels}</svg>`;
}
function radarDetailTable(scores, adaptado){
  const ranked = dominantProfile(scores).map(([k])=>k);
  const rows = ranked.map((k,i)=>{
    const n=scores[k], a=adaptado[k], d=Math.round((a-n)*10)/10;
    const arrow = d>0?'▲':(d<0?'▼':'●');
    const dcol = d>0?'#2C6B34':(d<0?'#9B2C2C':'#7A6E5A');
    const nivel = LEVEL_LABEL[factorLevel(n)];
    return `<tr>
      <td><span class="rd-rank">${i+1}º</span></td>
      <td><span class="rd-badge" style="background:${PROFILE_INFO[k].hex}">${k}</span><span class="rd-name">${PROFILE_INFO[k].name}</span><div class="rd-level">Intensidade natural: ${nivel}</div></td>
      <td class="rd-num">${n}%<div class="rd-mini"><span style="width:${n}%; background:${PROFILE_INFO[k].hex}"></span></div></td>
      <td class="rd-num">${a}%<div class="rd-mini"><span style="width:${a}%; background:${PROFILE_INFO[k].hex}; opacity:.55"></span></div></td>
      <td class="rd-num" style="color:${dcol}">${arrow} ${d>0?'+':''}${d} p.p.</td>
    </tr>`;
  }).join('');
  return `<table class="radar-detail">
    <thead><tr><th></th><th>Fator</th><th>Natural</th><th>Adaptado</th><th>Variação</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="rd-note"><b>Natural:</b> como a pessoa age espontaneamente. <b>Adaptado:</b> como ajusta o comportamento no trabalho. A variação mostra quanto cada fator aumenta (▲) ou diminui (▼) nessa adaptação.</p>`;
}

function mailtoLink(result){
  const subject = `Relatório de Perfil Comercial - ${result.name}`;

async function copyReportToClipboard(id){
  const r = state.results.find(x=>x.id===id);
  if(!r) return;
  const text = buildReportText(r);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast('Relatório copiado! Agora é só colar onde quiser enviar.');
  }catch(err){
    console.error('Erro ao copiar relatório:', err);
    showToast('Não foi possível copiar automaticamente. Selecione o texto manualmente.');
  }
}

function renderQuiz(){
  const q=state.quiz;
  if(q.phase==='transition') return renderQuizTransition();

  const isNatural = q.phase==='natural';
  const block=BLOCKS[q.index];
  const order=quizOrder();
  const most=quizMostArr()[q.index], least=quizLeastArr()[q.index];
  const pct = Math.round(((q.index)/20)*100);
  const phaseLabel = isNatural ? 'Perfil Natural' : 'Perfil Adaptado (no trabalho)';
  const instructions = isNatural
    ? 'Pense no seu jeito natural de ser, em qualquer situação da vida. Em cada bloco, escolha a palavra que <b>MAIS</b> e a que <b>MENOS</b> te representa.'
    : 'Agora pense especificamente em como você se comporta <b>no ambiente de trabalho</b>, sob as expectativas do dia a dia profissional. Em cada bloco, escolha a palavra que <b>MAIS</b> e a que <b>MENOS</b> te representa nesse contexto.';
  return `
  <div class="page container">
    <div class="quiz-shell">
      <div class="progress-wrap">
        <div class="progress-labels"><span>Etapa ${isNatural?'1':'2'} de 2 · ${phaseLabel} · Bloco ${q.index+1} de 20</span><span>${pct}% concluído</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; ${isNatural?'':'background:linear-gradient(90deg, var(--i-color), var(--maroon-deep));'}"></div></div>
      </div>
      <div class="card quiz-card">
        <div class="quiz-instructions">${instructions}</div>

        <div class="quiz-group-label most">✓ O que mais te representa</div>
        <div class="option-grid">
          ${order.map(cat=>`
            <button class="option-btn ${most===cat?'selected-most':''}" data-action="pick-most" data-cat="${cat}" ${least===cat?'disabled':''}>${block[cat]}</button>
          `).join('')}
        </div>

        <div class="quiz-group-label least">✕ O que menos te representa</div>
        <div class="option-grid">
          ${order.map(cat=>`
            <button class="option-btn ${least===cat?'selected-least':''}" data-action="pick-least" data-cat="${cat}" ${most===cat?'disabled':''}>${block[cat]}</button>
          `).join('')}
        </div>

        <div class="quiz-nav">
          <button class="btn btn-ghost" data-action="quiz-back" ${q.index===0?'disabled':''}>← Voltar</button>
          <button class="btn btn-primary" data-action="quiz-next" ${(most===null||least===null)?'disabled':''}>${(q.index===19 && !isNatural)?'Ver resultado':(q.index===19?'Concluir Etapa 1 →':'Próximo →')}</button>
        </div>
      </div>
    </div>
  </div>`;
}

          <div class="reco"><div class="chip-group-label">Reconhecimento</div><p>${GESTOR[t1].reconhecimento}</p></div>
          <div class="reco"><div class="chip-group-label">Delegação</div><p>${GESTOR[t1].delegacao}</p></div>
          <div class="reco"><div class="chip-group-label">Integração ao time</div><p>Nos primeiros 90 dias, priorizar ${AMBIENTE[t1][0].toLowerCase()} e ${AMBIENTE[t2][0].toLowerCase()}; alinhar desde o início o que se espera em ${PROFILE_INFO[t4].name.toLowerCase()}, o fator menos expressivo do perfil.</p></div>
        </div>
      </div>

      <div class="card report-section">
        <h3>Valores Pessoais</h3>
        <p>${values.texto}</p>
        ${values.predominantes.length ? `<div class="chip-group-label">Valores predominantes</div>${values.predominantes.map(v=>`<span class="value-chip predominante">${v}</span>`).join('')}` : ''}
        ${values.secundarios.length ? `<div class="chip-group-label">Valores secundários</div>${values.secundarios.map(v=>`<span class="value-chip secundario">${v}</span>`).join('')}` : ''}
      </div>

      <div class="two-col-grid">
        <div class="card report-section">
          <h3 style="font-size:16px;">Âncoras de Carreira</h3>
          <ul class="report-list">${(rep.ancorasCarreira||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="card report-section">
          <h3 style="font-size:16px;">Possíveis Conflitos de Valores</h3>
          <p>${rep.conflitosValores}</p>
        </div>
      </div>

      <div class="card report-section">
        <h3>Funções Comerciais — Compatibilidade</h3>
        <p class="section-intro" style="margin-bottom:8px;">${roleReading(r.scores, roleRanked[0][0], r.name)}</p>
        ${roleRanked.map(([k,v],idx)=>{
          const lbl = roleLabel(v);
          const info = ROLE_INFO[k];
          return `
          <div class="cargo-row">
            <div class="cargo-rank">${idx+1}</div>
            <div class="cargo-info">
              <div class="cargo-name">${info.name} — ${info.full}</div>
              <div class="cargo-desc">${info.tagline}</div>
            </div>
            <div class="cargo-metric">
              <div class="cargo-track"><div class="cargo-fill" style="width:${Math.min(100, v*2)}%; background:${info.hex}"></div></div>
              <div class="cargo-pct">${v}%</div>
              <span class="qual-badge ${lbl.cls}">${lbl.text}</span>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="card report-section">
        <h3>Plano de Desenvolvimento Individual (PDI)</h3>
        <p class="section-intro">Plano sugerido para os próximos 90 dias, construído a partir do fator predominante, do fator menos expressivo e das exigências da função de ${ROLE_INFO[roleRanked[0][0]].name}.</p>
        <div class="pdi-table-wrap"><table class="pdi-table">
          <thead><tr><th>#</th><th>Foco</th><th>Ação prática</th><th>Prazo</th><th>Como medir</th></tr></thead>
          <tbody>${(rep.pdiPlano||[]).map((x,i)=>`<tr><td><div class="pdi-num">${i+1}</div></td><td><b>${x.foco}</b></td><td>${x.acao}</td><td class="nowrap">${x.prazo}</td><td>${x.indicador}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>

      <div class="card report-section">
        <h3>Conclusão Executiva</h3>
        <p>${rep.conclusaoExecutiva}</p>
      </div>

      <div class="card report-section method-note">
        <h3 style="font-size:15px;">Nota Metodológica</h3>
        <p>O perfil foi obtido por escolha forçada em 20 blocos de adjetivos, respondidos em duas etapas: como a pessoa é naturalmente (Natural) e como age no trabalho (Adaptado). Os percentuais indicam a proporção de escolhas em cada fator (D, I, S, C) e somam 100%. Intensidade: Alto ≥ 33%, Moderado 18–32%, Baixo &lt; 18%. O índice de adaptação soma as diferenças entre os dois perfis (em pontos percentuais) e estima o esforço de ajuste ao ambiente. A aderência às funções comerciais é uma estimativa ponderada e deve ser usada como apoio — não substitui entrevista, histórico de desempenho e avaliação técnica.</p>
      </div>

      <div class="results-actions">
        <a class="btn btn-gold" href="${mailtoLink(r)}">✉ Enviar por e-mail</a>
        <button class="btn btn-outline" data-action="copy-report" data-id="${r.id}">📋 Copiar relatório</button>
        <button class="btn btn-outline" data-action="go-dashboard">Voltar ao início</button>
      </div>
      <div class="email-note">"Enviar por e-mail" abre seu aplicativo de e-mail padrão com o resumo já preenchido — você confere e clica em enviar por lá. Se nenhum aplicativo abrir (comum em navegadores sem um app de e-mail configurado), use "Copiar relatório" e cole onde preferir.</div>
    </div>
  </div>`;
}

/* ============ Event delegation ============ */
document.addEventListener('submit', (e)=>{
  const form = e.target.closest('[data-form]');
  if(!form) return;
  if(form.dataset.form==='login') handleLogin(e);
  if(form.dataset.form==='register') handleRegister(e);
  if(form.dataset.form==='activate-plan') activatePlanByEmailForm(e);
});

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='switch-register') switchAuthMode('register');
  else if(action==='switch-login') switchAuthMode('login');
  else if(action==='go-dashboard'){ state.view='dashboard'; render(); }
  else if(action==='go-clients'){ state.view='clients'; render(); }
  else if(action==='go-plans'){ state.view='plans'; render(); }
  else if(action==='go-admin'){ if(state.currentUser.isAdmin){ state.view='admin'; render(); } }
  else if(action==='logout') logout();
  else if(action==='start-quiz') startQuiz();
  else if(action==='pick-most') pickMost(el.dataset.cat);
  else if(action==='pick-least') pickLeast(el.dataset.cat);
  else if(action==='quiz-back') quizBack();
  else if(action==='continue-adaptado') continueToAdaptado();
  else if(action==='quiz-next') quizNext();
  else if(action==='view-result'){
    state.lastResultId=el.dataset.id;
    const r = state.results.find(x=>x.id===el.dataset.id);
    if(r && !r.report){ r.report = buildFallbackReport(r); saveResults().catch(e=>console.error(e)); }
    state.view='results'; render();
  }
  else if(action==='apply-inline-plan'){
    const row = el.closest('.coupon-row');
    const select = row ? row.querySelector('[data-role="inline-plan-select"]') : null;
    if(select) setUserPlan(el.dataset.email, select.value);
  }
  else if(action==='copy-report') copyReportToClipboard(el.dataset.id);
});

document.addEventListener('input', (e)=>{
  if(e.target.id==='client-search'){
    state.clientSearch = e.target.value;
    render();
    const inp=document.getElementById('client-search');
    if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  }
  if(e.target.id==='admin-user-search'){
    state.adminUserSearch = e.target.value;
    render();
    const inp=document.getElementById('admin-user-search');
    if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
  }
});

loadData();
</script>
</body>
</html>
